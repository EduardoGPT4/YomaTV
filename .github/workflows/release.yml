name: Build and publish YomaTV apps
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Compile and test without replacing a published release
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: yomatv-release
  cancel-in-progress: false
jobs:
  apps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r YomaTVPC/requirements.txt -r YomaTVPC/requirements-build.txt
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore original Android signing identity
        shell: pwsh
        env:
          YOMA_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          YOMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if(!$env:YOMA_KEYSTORE -or !$env:YOMA_KEYSTORE_PASSWORD){throw 'Missing Android signing secrets. Refusing to create a new identity.'}
          New-Item -ItemType Directory YomaTVAndroid/private -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $pwd 'YomaTVAndroid/private/seasonav1.jks'),[Convert]::FromBase64String($env:YOMA_KEYSTORE))
          [IO.File]::WriteAllText((Join-Path $pwd 'YomaTVAndroid/private/signing.properties'),('password='+$env:YOMA_KEYSTORE_PASSWORD),[Text.UTF8Encoding]::new($false))
      - name: Test, compile and prepare verified metadata
        shell: pwsh
        run: ./release-tools/build_apps.ps1
      - name: Determine release tag
        id: version
        shell: pwsh
        run: |
          $metadata=Get-Content release-artifacts/yomatv-downloads.json -Raw | ConvertFrom-Json
          if('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $metadata.tag){throw 'Tag does not match Android version'}
          'tag='+$metadata.tag >> $env:GITHUB_OUTPUT
      - name: Publish installers and metadata
        if: ${{ !inputs.verify_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if($LASTEXITCODE -eq 0){throw 'This release already exists. Bump the version instead of replacing installers.'}
          gh release create $env:RELEASE_TAG release-artifacts/* --title "YomaTV $env:RELEASE_TAG" --notes 'Android y Windows. Tamaños y SHA-256 incluidos en yomatv-downloads.json.' --target '${{ github.sha }}' --latest
          if($LASTEXITCODE){throw 'GitHub publication failed'}
      - name: Verify anonymous downloads, size and SHA-256
        if: ${{ !inputs.verify_only }}
        shell: pwsh
        run: python release-tools/verify_assets.py
      - name: Retain verified build artifacts
        if: ${{ inputs.verify_only }}
        uses: actions/upload-artifact@v4
        with:
          name: yomatv-verified-build
          path: release-artifacts/*
          retention-days: 3
      - name: Remove temporary signing files
        if: always()
        shell: pwsh
        run: |
          if(Test-Path YomaTVAndroid/private/seasonav1.jks){Remove-Item -LiteralPath YomaTVAndroid/private/seasonav1.jks}
          if(Test-Path YomaTVAndroid/private/signing.properties){Remove-Item -LiteralPath YomaTVAndroid/private/signing.properties}
